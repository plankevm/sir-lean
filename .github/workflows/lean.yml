name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evm:
    name: evm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: Evm BytecodeLayer Conform
          lake-package-directory: EVM
          use-mathlib-cache: true
          use-github-cache: true
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: EVM/.lake/build
          key: evm-build-${{ runner.os }}-${{ github.sha }}

  sir:
    name: sir
    needs: evm
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v5
        with:
          path: EVM/.lake/build
          key: evm-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: evm-build-${{ runner.os }}-
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          lake-package-directory: sir
          use-mathlib-cache: true
          use-github-cache: true

  ir-lowering:
    name: ir-lowering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: LirLean WIP
          lake-package-directory: experiments/005_ir_lowering
          use-mathlib-cache: true
          use-github-cache: true

# experiments 001 and 004 are not built here: 001 requires EVMYulLean from a
# path outside the repo, and 004 clones ethereum/tests during its build. 002 is
# on its own mathlib and imports nothing else.
